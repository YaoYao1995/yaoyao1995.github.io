title: "Yao Yao (姚瑶)"
description: "Associate Professor at Chongqing University. AI for Science, urban flood prediction, and intelligent decision-making for resilient infrastructure."
repository: "YaoYao1995/yaoyao1995.github.io"
google_scholar_stats_use_cdn: false
google_analytics_id: G-2CP4G5T9LP
google_site_verification:
bing_site_verification:
baidu_site_verification:
author:
  name: "Yao Yao (姚瑶)"
  avatar: "images/android-chrome-512x512.png"
  bio: "Associate Professor"
  school: "School of Management Science and Real Estate"
  university: "Chongqing University"
  location: "Chongqing, China"
  email: "yao_yao@cqu.edu.cn"
  faculty_profile: "https://msre.cqu.edu.cn/szdw/jslb/yy1.htm"
  googlescholar: "https://scholar.google.com/citations?user=hNO0NdEAAAAJ"
  github: "YaoYao1995"
  linkedin: "yao-yao-6119661b5"
  dblp: "https://dblp.org/pid/07/4410-6.html"
  orcid: "https://orcid.org/0000-0001-9887-4301"
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor
  - google_scholar_crawler
  - github_myprofile_updater
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true
sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Asia/Shanghai
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
compress_html:
  clippings: all
  ignore:
    envs: development
