name: Get Citation Data
on:
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Rebuild publication catalog using the last successful Scholar snapshot
        type: boolean
        default: false
  schedule:
    # Monday 08:17 China time; Tue/Wed retry only if this week's refresh failed.
    - cron: "17 0 * * 1,2,3"
permissions:
  contents: write
concurrency:
  group: google-scholar-update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v2
      - name: Install parser
        run: python3 -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch and validate publications and citations
        working-directory: google_scholar_crawler
        run: python3 -u main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish validated snapshot
        run: |
          set -euo pipefail
          if [ ! -s google_scholar_crawler/results/gs_data.json ]; then
            echo "No refresh needed; published data unchanged."
            exit 0
          fi
          git fetch origin google-scholar-stats
          git worktree add --detach stats FETCH_HEAD
          cp google_scholar_crawler/results/*.json stats/
          git -C stats config user.name "github-actions[bot]"
          git -C stats config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C stats add gs_data.json gs_data_shieldsio.json
          if git -C stats diff --cached --quiet; then exit 0; fi
          git -C stats commit -m "Refresh verified Scholar snapshot"
          git -C stats push origin HEAD:google-scholar-stats
      - name: Record failure without replacing published data
        if: failure()
        run: echo "Scholar refresh failed. The last published snapshot has been retained. Scheduled retries run on Tuesday and Wednesday if needed." >> "$GITHUB_STEP_SUMMARY"
