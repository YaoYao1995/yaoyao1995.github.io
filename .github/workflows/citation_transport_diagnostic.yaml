name: Citation transport diagnostic
on:
  push:
    branches: [codex/fix-citation-refresh]
    paths: [.github/workflows/citation_transport_diagnostic.yaml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3 curl_cffi==0.17.0
      - name: Compare public profile transports without publishing
        working-directory: google_scholar_crawler
        run: |
          python - <<'PY'
          import subprocess, urllib.request
          from curl_cffi import requests
          import main
          url = 'https://scholar.google.com.hk/citations?hl=en&user=hNO0NdEAAAAJ&pagesize=100&cstart=0'
          success = []
          def check(label, fetch):
              try:
                  html = fetch()
                  profile = main.parse_page(html, 'hNO0NdEAAAAJ')
                  print(label, 'VALID', profile['name'], len(profile['publications']), profile['metrics'], flush=True)
                  success.append(label)
              except Exception as error:
                  print(label, 'FAILED', type(error).__name__, str(error)[:160], flush=True)
          check('urllib', lambda: urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'}), timeout=20).read().decode())
          check('curl', lambda: subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20',url], text=True))
          def browser():
              response=requests.get(url, impersonate='chrome', timeout=20)
              response.raise_for_status()
              return response.text
          check('chrome', browser)
          print('Validated transports:', success, flush=True)
          if not success:
              raise SystemExit('All transports blocked; no data was published')
          PY
